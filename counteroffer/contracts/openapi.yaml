openapi: 3.1.0
info:
  title: CounterOffer public API target
  version: 1.0.0
  description: Implementation contract, not a claim that endpoints already exist.
    All writes validate Origin and CSRF except invite redemption, which validates
    Origin and rate limits. Quote creation is agent-mediated, not a direct public
    endpoint.
servers:
- url: http://127.0.0.1:8000
  description: Local development only; configure exact HTTPS public origin for demo.
security:
- SessionCookie: []
paths:
  /healthz:
    get:
      operationId: health
      security: []
      responses:
        '200':
          description: Liveness only; no dependency secrets.
  /api/session:
    post:
      operationId: redeem_invite
      security: []
      description: Origin validation and rate limit required. Sets secure HttpOnly
        session cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Invite'
      responses:
        '200':
          description: Authenticated synthetic buyer session; Set-Cookie provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          description: Invalid or expired invite.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: get_session
      responses:
        '200':
          description: Current session and CSRF token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          description: Session absent or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: logout
      parameters:
      - &id001
        name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Session revoked; cookie cleared.
        '403':
          description: Origin/CSRF invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/conversations:
    post:
      operationId: create_conversation
      parameters:
      - *id001
      responses:
        '201':
          description: Conversation created from server-side identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationCreated'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Origin/CSRF invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/conversations/{conversation_id}:
    get:
      operationId: read_conversation
      parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Own safe conversation view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '404':
          description: Missing or inaccessible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/conversations/{conversation_id}/turns:
    post:
      operationId: submit_turn
      parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
      - *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TurnInput'
      responses:
        '202':
          description: Turn accepted or existing idempotent turn returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnAccepted'
        '409':
          description: Client request ID reused with different content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Queue or session limit reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Missing or inaccessible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/turns/{turn_id}:
    get:
      operationId: read_turn
      parameters:
      - name: turn_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Read-only state, never executes agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Turn'
        '404':
          description: Missing or inaccessible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/turns/{turn_id}/events:
    get:
      operationId: read_turn_events
      parameters:
      - name: turn_id
        in: path
        required: true
        schema:
          type: string
      - name: Last-Event-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[0-9]+$
      responses:
        '200':
          description: Persistent read-only SSE; schema in event.schema.json.
          content:
            text/event-stream:
              schema:
                type: string
        '404':
          description: Missing or inaccessible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/quotes/{quote_id}:
    get:
      operationId: read_quote_view
      parameters:
      - name: quote_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Own sanitized cached quote DTO.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '404':
          description: Missing or inaccessible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: counteroffer_session
  schemas:
    Money: &id002
      type: object
      properties:
        amount:
          type: string
          pattern: ^[0-9]+\.[0-9]{2}$
        currency:
          const: INR
      required:
      - amount
      - currency
      additionalProperties: false
    Quote:
      type: object
      properties:
        quote_id:
          type: string
          pattern: ^Q-[A-Z0-9-]{6,64}$
        merchant_id: &id004
          type: string
          pattern: ^MERCHANT-[A-Z0-9-]{1,32}$
        buyer_id: &id003
          type: string
          pattern: ^BUYER-[A-Z0-9-]{1,32}$
        operation_id:
          type: string
          format: uuid
        shopify_draft_gid:
          type: string
          pattern: ^gid://shopify/DraftOrder/[0-9]+$
        external_name:
          type: string
          minLength: 1
        version:
          type: integer
          minimum: 1
        status:
          enum:
          - DRAFT
          - CHANGED_EXTERNALLY
        items:
          type: array
          items:
            type: object
            properties:
              sku:
                type: string
                pattern: ^[A-Z0-9][A-Z0-9-]{0,31}$
              title:
                type: string
                minLength: 1
                maxLength: 160
              selling_unit:
                type: string
                minLength: 1
                maxLength: 80
              quantity:
                type: integer
                minimum: 1
              unit_price: *id002
            required:
            - sku
            - title
            - selling_unit
            - quantity
            - unit_price
            additionalProperties: false
          minItems: 1
          maxItems: 20
        discount_bps:
          type: integer
          minimum: 0
          maximum: 10000
        subtotal: *id002
        total_discount: *id002
        total_tax: *id002
        total: *id002
        stock_reserved:
          const: false
        paid:
          const: false
        observed_at:
          type: string
          format: date-time
        warnings:
          type: array
          items:
            type: string
            maxLength: 500
          maxItems: 10
      required:
      - quote_id
      - merchant_id
      - buyer_id
      - operation_id
      - shopify_draft_gid
      - external_name
      - version
      - status
      - items
      - discount_bps
      - subtotal
      - total_discount
      - total_tax
      - total
      - stock_reserved
      - paid
      - observed_at
      - warnings
      additionalProperties: false
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
          required:
          - code
          - message
          - request_id
          additionalProperties: false
      required:
      - error
      additionalProperties: false
    Invite:
      type: object
      properties:
        code:
          type: string
          minLength: 16
          maxLength: 256
      required:
      - code
      additionalProperties: false
    Session:
      type: object
      properties:
        buyer_id: *id003
        merchant_id: *id004
        buyer_display_name:
          type: string
        csrf_token:
          type: string
        expires_at:
          type: string
          format: date-time
      required:
      - buyer_id
      - merchant_id
      - buyer_display_name
      - csrf_token
      - expires_at
      additionalProperties: false
    ConversationCreated:
      type: object
      properties:
        conversation_id: &id005
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
      required:
      - conversation_id
      - created_at
      additionalProperties: false
    TurnInput:
      type: object
      properties:
        client_request_id: *id005
        text:
          type: string
          minLength: 1
          maxLength: 4000
      required:
      - client_request_id
      - text
      additionalProperties: false
    TurnAccepted:
      type: object
      properties:
        turn_id: *id005
        status:
          enum: &id006
          - QUEUED
          - RUNNING
          - COMPLETED
          - NEEDS_CLARIFICATION
          - FAILED
          - INTERRUPTED
        events_url:
          type: string
        status_url:
          type: string
      required:
      - turn_id
      - status
      - events_url
      - status_url
      additionalProperties: false
    Turn:
      type: object
      properties:
        turn_id: *id005
        status:
          enum: *id006
        last_sequence:
          type: integer
          minimum: 0
        quotes:
          type: array
          items:
            $ref: '#/components/schemas/Quote'
        error:
          anyOf:
          - $ref: '#/components/schemas/Error'
          - type: 'null'
      required:
      - turn_id
      - status
      - last_sequence
      - quotes
      - error
      additionalProperties: false
    Conversation:
      type: object
      properties:
        conversation_id: *id005
        messages:
          type: array
          items:
            type: object
            properties:
              role:
                enum:
                - user
                - assistant
              text:
                type: string
              turn_id: *id005
            required:
            - role
            - text
            - turn_id
            additionalProperties: false
        quotes:
          type: array
          items:
            $ref: '#/components/schemas/Quote'
      required:
      - conversation_id
      - messages
      - quotes
      additionalProperties: false
